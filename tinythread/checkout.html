<!doctype html><html lang="en"><head><title>Checkout · Tiny Thread</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body data-page="checkout"><main><section class="wrap"><h1 style="font-size:clamp(2rem,6vw,3.2rem);margin-bottom:1.2rem">Checkout</h1><div id="cowrap" class="cl"><div class="glass panel"><form id="form"><div class="f2"><label>Full name<input id="nm" required autocomplete="name"></label><label>Phone<input id="ph" type="tel" required autocomplete="tel"></label></div><label>Delivery address<textarea rows="2" required autocomplete="street-address"></textarea></label><div class="f2"><label>City<input required autocomplete="address-level2"></label><label>Payment<select><option>Pay on delivery</option><option>Bank transfer</option><option>Card</option></select></label></div><button class="btn" type="submit">Place order</button></form></div><div class="glass panel"><h3 style="margin-bottom:.6rem">Your order</h3><div id="mini"></div></div></div></section></main><script src="app.js"></script></body></html>
